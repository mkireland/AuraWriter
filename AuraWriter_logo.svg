<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="auraGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" />
      <stop offset="100%" stop-color="#7579ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Sleek Dark Background -->
  <rect width="512" height="512" rx="110" fill="#121218" />
  
  <!-- Glowing 'A' / Node Tree Structure -->
  <path d="M 256 140 L 150 360 M 256 140 L 362 360 M 180 290 L 332 290" 
        stroke="url(#auraGradient)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
        
  <!-- Interactive Nodes (Dots) -->
  <circle cx="256" cy="140" r="32" fill="url(#glowGradient)" />
  <circle cx="150" cy="360" r="24" fill="#121218" stroke="url(#auraGradient)" stroke-width="8" />
  <circle cx="362" cy="360" r="24" fill="#121218" stroke="url(#auraGradient)" stroke-width="8" />
  <circle cx="256" cy="290" r="20" fill="url(#glowGradient)" />
</svg>
